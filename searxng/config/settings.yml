# SearXNG on claude-dev, reachable from that machine only (docker-compose.yml publishes 127.0.0.1:8888).
# Everything not listed here comes from SearXNG's defaults.
# Reference: https://docs.searxng.org/admin/settings/settings_search.html (2026.10.30)
use_default_settings: true

general:
  instance_name: "research-tools"
  debug: false
  enable_metrics: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  # Overridden by SEARXNG_SECRET from ~/.config/research-tools/searxng.env (see docker-compose.yml).
  secret_key: "replace-me"
  # The limiter needs Valkey and exists to protect public instances. Only this machine can reach this one.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  # json is off by default; without it /search?format=json returns 403.
  formats:
    - html
    - json

ui:
  static_use_hash: true

# Off by default in this SearXNG version; switched on 2026-11-03 (Gianni, option A) because the three default
# general engines (Brave, DuckDuckGo, Google CSE) blocked the server within about 40 searches.
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: qwant
    disabled: false
